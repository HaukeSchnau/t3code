name: Desktop

# Ships every green main commit to the fork's macOS app (patches/desktop-distribution.md).
# Like mobile.yml it follows CI instead of living in it, so CI never waits for the
# Apple builder and a desktop failure never turns CI red. A newer green commit
# cancels an older desktop build; only the newest one matters to the updater.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: t3code-desktop
  cancel-in-progress: true

env:
  NIX_CONFIG: experimental-features = nix-command flakes
  CI_PROJECT_ID: t3code

jobs:
  package:
    name: Package
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: apple-builder
    timeout-minutes: 60
    # The Apple builder provides Xcode, Node and the signing keychain. This
    # flake's older nixpkgs misbehaves on macOS 27, so Rust comes from the
    # builder's own pinned nixpkgs registry entry.
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # The builder sits behind a slow home uplink; pnpm's 60 s default aborts
      # large tarballs when many download at once.
      - name: Install dependencies
        env:
          pnpm_config_fetch_timeout: "600000"
        run: corepack pnpm install --frozen-lockfile --trust-lockfile --network-concurrency 4

      # CI's run number only grows, so the updater sees every build as newer.
      # It also continues the numbering of builds made while this ran inside CI.
      - name: Stamp the build version
        env:
          CI_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          base_version="$(node -p "require('./apps/desktop/package.json').version")"
          node scripts/update-release-package-versions.ts "${base_version}-schnau.${CI_RUN_NUMBER}"

      - name: Package and sign
        env:
          T3CODE_DESKTOP_UPDATE_URL: https://t3code-updates.schnau.dev/desktop
          # Urbs UG's Apple Development identity in the runner's login keychain.
          # The team-based designated requirement keeps updates and macOS
          # permissions working when that certificate is replaced.
          CSC_NAME: "Apple Development: Created via API (85N8Y9CZC4)"
          T3CODE_APPLE_TEAM_ID: 2243J9RD68
        run: |
          set -euo pipefail
          export PATH="$PWD/node_modules/.bin:/run/current-system/sw/bin:$PATH"
          nix shell nixpkgs#cargo nixpkgs#rustc --command \
            node scripts/build-desktop-artifact.ts \
              --platform mac --target zip --arch arm64 --signed --output-dir desktop-release

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac-arm64
          path: |
            desktop-release/*-arm64.zip
            desktop-release/*-arm64.zip.blockmap
            desktop-release/latest-mac.yml
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish
    needs: package
    runs-on: t3code-ci
    timeout-minutes: 15
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Release notes list the main commits since the previous build.
          fetch-depth: 100

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: desktop-mac-arm64
          path: desktop-release

      # In a workflow_run job GITHUB_SHA is main's head when the event fired,
      # not the commit CI tested, so the commit is passed explicitly.
      - name: Publish to the update feed
        env:
          DESKTOP_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -x /run/current-system/sw/bin/nix ]; then
            export PATH="/run/current-system/sw/bin:$PATH"
          fi
          source_workspace="$GITHUB_WORKSPACE"
          exec nix develop .#ci --command \
            "$source_workspace/scripts/ci-workspace-run.sh" \
            "$source_workspace" just ci-desktop-publish desktop-release "$DESKTOP_COMMIT"
