name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t3code-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: experimental-features = nix-command flakes
  CI_PROJECT_ID: t3code

jobs:
  static:
    name: Format and lint
    runs-on: t3code-ci
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Run static checks
        run: |
          set -euo pipefail
          if [ -x /run/current-system/sw/bin/nix ]; then
            export PATH="/run/current-system/sw/bin:$PATH"
          fi
          source_workspace="$GITHUB_WORKSPACE"
          exec nix develop .#ci --command \
            "$source_workspace/scripts/ci-workspace-run.sh" \
            "$source_workspace" just qa-static

  typecheck:
    name: Type-check ${{ matrix.group }}
    runs-on: t3code-ci
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [clients, rest]
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Run type checks
        run: |
          set -euo pipefail
          if [ -x /run/current-system/sw/bin/nix ]; then
            export PATH="/run/current-system/sw/bin:$PATH"
          fi
          source_workspace="$GITHUB_WORKSPACE"
          exec nix develop .#ci --command \
            "$source_workspace/scripts/ci-workspace-run.sh" \
            "$source_workspace" just 'qa-typecheck-${{ matrix.group }}'

  test_non_server:
    name: Test packages and clients
    runs-on: t3code-ci
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          set -euo pipefail
          if [ -x /run/current-system/sw/bin/nix ]; then
            export PATH="/run/current-system/sw/bin:$PATH"
          fi
          source_workspace="$GITHUB_WORKSPACE"
          exec nix develop .#ci --command \
            "$source_workspace/scripts/ci-workspace-run.sh" \
            "$source_workspace" just qa-test-non-server

  test_server:
    name: Test server ${{ matrix.shard }}/3
    runs-on: t3code-ci
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Run server test shard
        run: |
          set -euo pipefail
          if [ -x /run/current-system/sw/bin/nix ]; then
            export PATH="/run/current-system/sw/bin:$PATH"
          fi
          source_workspace="$GITHUB_WORKSPACE"
          exec nix develop .#ci --command \
            "$source_workspace/scripts/ci-workspace-run.sh" \
            "$source_workspace" just qa-test-server-shard '${{ matrix.shard }}' 3

  release_smoke:
    name: Release smoke
    runs-on: t3code-ci
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Exercise release-only steps
        run: |
          set -euo pipefail
          if [ -x /run/current-system/sw/bin/nix ]; then
            export PATH="/run/current-system/sw/bin:$PATH"
          fi
          source_workspace="$GITHUB_WORKSPACE"
          exec nix develop .#ci --command \
            "$source_workspace/scripts/ci-workspace-run.sh" \
            "$source_workspace" just qa-release

  release_check:
    name: Release contract
    needs: [static, typecheck, test_non_server, test_server, release_smoke]
    runs-on: t3code-ci
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Verify release contract
        run: |
          set -euo pipefail
          if [ -x /run/current-system/sw/bin/nix ]; then
            export PATH="/run/current-system/sw/bin:$PATH"
          fi
          system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          nix build ".#checks.${system}.projectReleaseGate" --no-link --print-build-logs

  release:
    name: Release
    needs: release_check
    uses: schnau/nix-infra-modules/.gitea/workflows/project-release.yml@main
    with:
      runner_label: t3code-ci
