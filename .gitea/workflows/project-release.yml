name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t3code-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: experimental-features = nix-command flakes
  CI_PROJECT_ID: t3code

jobs:
  dependency_hashes:
    name: Nix dependency hashes
    runs-on: t3code-ci
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Build filtered dependency stores
        run: |
          set -euo pipefail
          if [ -x /run/current-system/sw/bin/nix ]; then
            export PATH="/run/current-system/sw/bin:$PATH"
          fi
          exec nix build \
            .#t3code.pnpmDeps.web \
            .#t3code.pnpmDeps.server \
            .#t3code.pnpmDeps.runtime \
            --no-link \
            --print-build-logs

  static:
    name: Format and lint
    runs-on: t3code-ci
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Run static checks
        run: |
          set -euo pipefail
          if [ -x /run/current-system/sw/bin/nix ]; then
            export PATH="/run/current-system/sw/bin:$PATH"
          fi
          source_workspace="$GITHUB_WORKSPACE"
          exec nix develop .#ci --command \
            "$source_workspace/scripts/ci-workspace-run.sh" \
            "$source_workspace" just qa-static

  typecheck:
    name: Type-check ${{ matrix.group }}
    runs-on: t3code-ci
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [clients, rest]
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Run type checks
        env:
          # Native TypeScript uses Go; collect before the runner hits MemoryHigh.
          GOMEMLIMIT: 3GiB
        run: |
          set -euo pipefail
          if [ -x /run/current-system/sw/bin/nix ]; then
            export PATH="/run/current-system/sw/bin:$PATH"
          fi
          source_workspace="$GITHUB_WORKSPACE"
          exec nix develop .#ci --command \
            "$source_workspace/scripts/ci-workspace-run.sh" \
            "$source_workspace" just 'qa-typecheck-${{ matrix.group }}'

  test_non_server:
    name: Test packages and clients
    runs-on: t3code-ci-non-server
    # Measured 4-22 min on the shared runners; the limit only catches hangs.
    timeout-minutes: 35
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          set -euo pipefail
          if [ -x /run/current-system/sw/bin/nix ]; then
            export PATH="/run/current-system/sw/bin:$PATH"
          fi
          source_workspace="$GITHUB_WORKSPACE"
          exec nix develop .#ci --command \
            "$source_workspace/scripts/ci-workspace-run.sh" \
            "$source_workspace" just qa-test-non-server

  test_server:
    name: Test server ${{ matrix.shard }}/3
    runs-on: t3code-ci
    # Shards measured 9-14 min on the shared runners and kept growing; at 15
    # the limit cancelled healthy runs. It only needs to catch hangs.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Run server test shard
        run: |
          set -euo pipefail
          if [ -x /run/current-system/sw/bin/nix ]; then
            export PATH="/run/current-system/sw/bin:$PATH"
          fi
          source_workspace="$GITHUB_WORKSPACE"
          exec nix develop .#ci --command \
            "$source_workspace/scripts/ci-workspace-run.sh" \
            "$source_workspace" just qa-test-server-shard '${{ matrix.shard }}' 3

  release_smoke:
    name: Release smoke
    runs-on: t3code-ci
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Exercise release-only steps
        run: |
          set -euo pipefail
          if [ -x /run/current-system/sw/bin/nix ]; then
            export PATH="/run/current-system/sw/bin:$PATH"
          fi
          source_workspace="$GITHUB_WORKSPACE"
          exec nix develop .#ci --command \
            "$source_workspace/scripts/ci-workspace-run.sh" \
            "$source_workspace" just qa-release

  release_check:
    name: Release contract
    needs: [dependency_hashes, static, typecheck, test_non_server, test_server, release_smoke]
    runs-on: t3code-ci
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Verify release contract
        run: |
          set -euo pipefail
          if [ -x /run/current-system/sw/bin/nix ]; then
            export PATH="/run/current-system/sw/bin:$PATH"
          fi
          system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          nix build ".#checks.${system}.projectReleaseGate" --no-link --print-build-logs

  release:
    name: Release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: release_check
    uses: schnau/nix-infra-modules/.gitea/workflows/project-release.yml@main
    with:
      runner_label: t3code-ci

  # Fork: every main push packages the signed macOS app on the Apple builder while
  # the rest of CI runs, and desktop_publish ships it once CI passes. See
  # patches/desktop-distribution.md.
  desktop_package:
    name: Desktop package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: apple-builder
    timeout-minutes: 60
    # The Apple builder provides Xcode, Node and the signing keychain. This
    # flake's older nixpkgs misbehaves on macOS 27, so Rust comes from the
    # builder's own pinned nixpkgs registry entry.
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      # The builder sits behind a slow home uplink; pnpm's 60 s default aborts
      # large tarballs when many download at once.
      - name: Install dependencies
        env:
          pnpm_config_fetch_timeout: "600000"
        run: corepack pnpm install --frozen-lockfile --trust-lockfile --network-concurrency 4

      # Gitea run numbers only grow, so the updater sees every build as newer.
      - name: Stamp the build version
        run: |
          set -euo pipefail
          base_version="$(node -p "require('./apps/desktop/package.json').version")"
          node scripts/update-release-package-versions.ts "${base_version}-schnau.${GITHUB_RUN_NUMBER}"

      - name: Package and sign
        env:
          T3CODE_DESKTOP_UPDATE_URL: https://t3code-updates.schnau.dev/desktop
          # Urbs UG's Apple Development identity in the runner's login keychain.
          # The team-based designated requirement keeps updates and macOS
          # permissions working when that certificate is replaced.
          CSC_NAME: "Apple Development: Created via API (85N8Y9CZC4)"
          T3CODE_APPLE_TEAM_ID: 2243J9RD68
        run: |
          set -euo pipefail
          export PATH="$PWD/node_modules/.bin:/run/current-system/sw/bin:$PATH"
          nix shell nixpkgs#cargo nixpkgs#rustc --command \
            node scripts/build-desktop-artifact.ts \
              --platform mac --target zip --arch arm64 --signed --output-dir desktop-release

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac-arm64
          path: |
            desktop-release/*-arm64.zip
            desktop-release/*-arm64.zip.blockmap
            desktop-release/latest-mac.yml
          if-no-files-found: error
          retention-days: 3

  desktop_publish:
    name: Desktop publish
    needs: [release_check, desktop_package]
    runs-on: t3code-ci
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          # Release notes list the main commits since the previous build.
          fetch-depth: 100

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: desktop-mac-arm64
          path: desktop-release

      - name: Publish to the update feed
        run: |
          set -euo pipefail
          if [ -x /run/current-system/sw/bin/nix ]; then
            export PATH="/run/current-system/sw/bin:$PATH"
          fi
          source_workspace="$GITHUB_WORKSPACE"
          exec nix develop .#ci --command \
            "$source_workspace/scripts/ci-workspace-run.sh" \
            "$source_workspace" just ci-desktop-publish desktop-release
